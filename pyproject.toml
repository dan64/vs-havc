[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/test_images",
  "/test_images_ex",
  "/hybrid_setup"
]

[project]
name = "vshavc"
version = "5.8.7"
description = "HAVC functions for VapourSynth"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Dan64", email = "whitedan64@gmail.com"}]
keywords = ["Deoldify", "VapourSynth"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video"
]
dependencies = [   
  "numpy>=1.26.2",
  "vsddcolor>=1.0.0",
  "fastai==1.0.60",
  "torch>=2.7.1",
  "safetensors>=0.4.0",
  "pillow>=9.0.0",
  "vstools>=2.1.0",
  "opencv-python>=4.0.0",
  "scikit-image>=0.20.0",
  "einops>=0.8",
]

[project.urls]
"Homepage" = "https://github.com/dan64/vs-havc"
"Bug Tracker" = "https://github.com/dan64/vs-havc/issues"
